<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 248" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20232b" />
      <stop offset="100%" stop-color="#121418" />
    </linearGradient>
  </defs>

  <!-- True circle per docs.zepp.com/docs/designs/visual/icons/ - 248x248
       canvas, r=120 leaves the required 4px transparent margin. -->
  <circle cx="124" cy="124" r="120" fill="url(#bgGrad)" />

  <!-- Three bars, echoing the app's own stacked-bar/card visual language
       (lib/theme.js's COLOR.app/system/music) rather than a generic
       gauge icon. -->
  <g stroke-linecap="round">
    <rect x="72" y="146" width="20" height="46" rx="6" fill="#4a9eff" />
    <rect x="114" y="112" width="20" height="80" rx="6" fill="#ff9f0a" />
    <rect x="156" y="82" width="20" height="110" rx="6" fill="#38c98d" />
  </g>
</svg>
